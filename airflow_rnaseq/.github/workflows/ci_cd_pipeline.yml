name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Lint Python code with flake8
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --ignore=E501

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/

  validate_dag:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Validate Airflow DAG files
        run: |
          pip install apache-airflow
          airflow dags list
          airflow dags test <your_dag_id> --start-date 2025-01-01 --end-date 2025-01-01

  deploy:
    runs-on: ubuntu-latest
    needs: validate_dag
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Deploy to AWS (EC2/S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
        run: |
          echo "Deploying DAG to AWS"
          aws s3 cp your_dag_file.py s3://your-dag-bucket/dags/ --region $AWS_REGION
          aws s3 cp output_dir/ s3://your-output-bucket/ --recursive --region $AWS_REGION

      - name: Notify Deployment Success
        uses: peter-evans/slack-notify@v2
        with:
          status: success
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  failure-notify:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Notify Failure
        uses: peter-evans/slack-notify@v2
        with:
          status: failure
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

